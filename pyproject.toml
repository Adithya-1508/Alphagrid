[project]
name = "alphagrid"
version = "0.1.0"
description = "AlphaGrid AI - Time-Series Forecasting & Agentic Intelligence"
readme = "README.md"
authors = [
    { name = "Adithya Vijay", email = "adithyavijay1508@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "chromadb>=1.5.9",
    "entsoe-py>=0.8.0",
    "fastapi>=0.139.0",
    "feedparser>=6.0.12",
    "fpdf2>=2.8.7",
    "lightgbm>=4.6.0",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "openmeteo-requests>=1.7.5",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.1",
    "uvicorn>=0.51.0",
    "xgboost>=3.3.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]
test = ["pytest"]
ml = ["lightgbm", "xgboost", "catboost", "scikit-learn", "sentence-transformers", "entsoe-py", "openmeteo-requests", "optuna"]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "BLE"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
